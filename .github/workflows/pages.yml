name: Página web

# Copia la carpeta site/ a la rama gh-pages, desde donde GitHub Pages publica
# https://santiagogd2513-cpu.github.io/P-gina-de-La-aplicaci-n/
on:
  push:
    branches: [ "claude/android-multiplatform-app-jjj5yn", "main" ]
    paths: [ "site/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar site/ en la rama gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar página web (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
