name: Build APK

on:
  push:
    branches: [ "**" ]
    # Los cambios solo en la página web no recompilan la app.
    paths-ignore: [ "site/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas (shaders, registro, numerología)
        run: ./gradlew :composeApp:desktopTest --console=plain

      - name: Compilar APK
        run: ./gradlew :composeApp:assembleDebug --console=plain

      - name: Renombrar APK
        run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk LunaMistica-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LunaMistica-apk
          path: LunaMistica-${{ github.run_number }}.apk

  windows:
    name: Windows (instalador .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Crear instalador .exe
        shell: bash
        run: ./gradlew :composeApp:packageExe -PappVersion=5.0.${{ github.run_number }} --console=plain

      - name: Renombrar instalador
        shell: bash
        run: |
          ls -la composeApp/build/compose/binaries/main/exe/
          cp composeApp/build/compose/binaries/main/exe/*.exe "LunaMistica-Setup-${{ github.run_number }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: LunaMistica-windows
          path: LunaMistica-Setup-${{ github.run_number }}.exe

  release:
    name: Publicar en Releases
    needs: [ android, windows ]
    if: github.ref == 'refs/heads/claude/android-multiplatform-app-jjj5yn' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Copias con nombre fijo: la página web enlaza a
      # .../releases/latest/download/LunaMistica.apk y LunaMistica-Setup.exe,
      # que siempre apuntan a la versión más reciente.
      - name: Nombres fijos para la página web
        run: |
          cp dist/LunaMistica-${{ github.run_number }}.apk dist/LunaMistica.apk
          cp dist/LunaMistica-Setup-${{ github.run_number }}.exe dist/LunaMistica-Setup.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: luna-${{ github.run_number }}
          name: "Luna Mística #${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body: |
            Versión de prueba generada automáticamente desde `${{ github.ref_name }}` (${{ github.sha }}).

            **Android:** descarga `LunaMistica.apk` en el teléfono, permite "instalar apps de origen desconocido" y ábrelo.

            **Windows:** descarga `LunaMistica-Setup.exe` y ejecútalo. Si Windows muestra "Windows protegió su PC", pulsa **Más información → Ejecutar de todas formas** (el instalador no está firmado con un certificado de pago).
          files: dist/*
