name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas (shaders y numerología)
        run: ./gradlew :composeApp:desktopTest --console=plain

      - name: Compilar APK
        run: ./gradlew :composeApp:assembleDebug --console=plain

      - name: Renombrar APK
        run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk LunaMistica-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LunaMistica-apk
          path: LunaMistica-${{ github.run_number }}.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Luna Mística APK #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            APK de prueba (debug) generado automáticamente desde `${{ github.ref_name }}` (${{ github.sha }}).
            Descárgalo en tu Android, permite "instalar apps de origen desconocido" y ábrelo.
          files: LunaMistica-${{ github.run_number }}.apk
