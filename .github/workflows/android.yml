name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas (shaders, registro, numerología)
        run: ./gradlew :composeApp:desktopTest --console=plain

      - name: Compilar APK
        run: ./gradlew :composeApp:assembleDebug --console=plain

      - name: Renombrar APK
        run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk LunaMistica-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LunaMistica-apk
          path: LunaMistica-${{ github.run_number }}.apk

  windows:
    name: Windows (instalador .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Crear instalador .exe
        shell: bash
        run: ./gradlew :composeApp:packageExe -PappVersion=5.0.${{ github.run_number }} --console=plain

      - name: Renombrar instalador
        shell: bash
        run: |
          ls -la composeApp/build/compose/binaries/main/exe/
          cp composeApp/build/compose/binaries/main/exe/*.exe "LunaMistica-Setup-${{ github.run_number }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: LunaMistica-windows
          path: LunaMistica-Setup-${{ github.run_number }}.exe

  release:
    name: Publicar en Releases
    needs: [ android, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: luna-${{ github.run_number }}
          name: Luna Mística #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Versión de prueba generada automáticamente desde `${{ github.ref_name }}` (${{ github.sha }}).

            **Android:** descarga `LunaMistica-${{ github.run_number }}.apk` en el teléfono, permite "instalar apps de origen desconocido" y ábrelo.

            **Windows:** descarga `LunaMistica-Setup-${{ github.run_number }}.exe` y ejecútalo. Si Windows muestra "Windows protegió su PC", pulsa **Más información → Ejecutar de todas formas** (el instalador no está firmado con un certificado de pago).
          files: dist/*
